<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
            <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
        </linearGradient>

        <linearGradient id="polaroidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
            <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:0.95" />
        </linearGradient>

        <linearGradient id="photoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#fd79a8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:1" />
        </linearGradient>

        <!-- Filters -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="shadow">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.3"/>
        </filter>

        <filter id="innerShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.5"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background with rounded corners -->
    <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>

    <!-- Glass overlay effect -->
    <rect width="1024" height="1024" rx="180" fill="url(#glassGradient)" opacity="0.5"/>

    <!-- Polaroid Frame -->
    <g transform="translate(512, 512)" filter="url(#shadow)">
        <!-- Main Polaroid body -->
        <rect x="-280" y="-320" width="560" height="640" rx="20"
              fill="url(#polaroidGradient)"
              stroke="rgba(255,255,255,0.6)"
              stroke-width="3"/>

        <!-- Photo area with gradient -->
        <rect x="-250" y="-290" width="500" height="420" rx="8"
              fill="url(#photoGradient)" opacity="0.9"/>

        <!-- Photo frame inner shadow -->
        <rect x="-250" y="-290" width="500" height="420" rx="8"
              fill="none"
              stroke="rgba(0,0,0,0.1)"
              stroke-width="2"/>

        <!-- Camera icon (centered in photo) -->
        <g transform="translate(0, -100)" opacity="0.9" filter="url(#glow)">
            <!-- Camera body -->
            <rect x="-60" y="-30" width="120" height="80" rx="8"
                  fill="white" opacity="0.95"/>

            <!-- Lens -->
            <circle cx="0" cy="10" r="35"
                    fill="rgba(102, 126, 234, 0.3)"
                    stroke="white"
                    stroke-width="4"/>
            <circle cx="0" cy="10" r="25"
                    fill="rgba(102, 126, 234, 0.5)"/>
            <circle cx="-8" cy="2" r="8"
                    fill="rgba(255, 255, 255, 0.6)"/>

            <!-- Flash -->
            <rect x="35" y="-25" width="18" height="12" rx="3"
                  fill="white" opacity="0.9"/>

            <!-- Viewfinder -->
            <rect x="-50" y="-25" width="15" height="10" rx="2"
                  fill="rgba(102, 126, 234, 0.4)"/>
        </g>

        <!-- Location Pin Icon (bottom right of photo) -->
        <g transform="translate(140, 70)" filter="url(#glow)">
            <!-- Pin shape -->
            <path d="M 0,-30 C -12,-30 -22,-20 -22,-8 C -22,0 0,25 0,25 C 0,25 22,0 22,-8 C 22,-20 12,-30 0,-30 Z"
                  fill="#ff6b6b"
                  stroke="white"
                  stroke-width="3"
                  opacity="0.95"/>

            <!-- Pin center dot -->
            <circle cx="0" cy="-8" r="6" fill="white"/>
        </g>

        <!-- Bottom white space with text area -->
        <rect x="-250" y="130" width="500" height="190"
              fill="rgba(255,255,255,0.95)"
              filter="url(#innerShadow)"/>

        <!-- QR Code representation (simplified) -->
        <g transform="translate(-180, 200)">
            <!-- QR background -->
            <rect x="0" y="0" width="80" height="80" rx="4"
                  fill="white"
                  stroke="rgba(0,0,0,0.1)"
                  stroke-width="2"/>

            <!-- QR pattern (simplified squares) -->
            <rect x="8" y="8" width="20" height="20" fill="#333"/>
            <rect x="52" y="8" width="20" height="20" fill="#333"/>
            <rect x="8" y="52" width="20" height="20" fill="#333"/>
            <rect x="35" y="35" width="12" height="12" fill="#333"/>
            <rect x="20" y="35" width="8" height="8" fill="#333"/>
            <rect x="35" y="20" width="8" height="8" fill="#333"/>
            <rect x="52" y="35" width="8" height="8" fill="#333"/>
            <rect x="52" y="52" width="12" height="12" fill="#333"/>
        </g>

        <!-- Location text representation -->
        <g transform="translate(-50, 210)" opacity="0.6">
            <rect x="0" y="0" width="180" height="8" rx="4" fill="#333"/>
            <rect x="0" y="16" width="140" height="8" rx="4" fill="#333"/>
            <rect x="0" y="32" width="160" height="8" rx="4" fill="#333"/>
            <rect x="0" y="48" width="120" height="8" rx="4" fill="#333"/>
        </g>
    </g>

    <!-- Sparkle effects -->
    <g opacity="0.6">
        <circle cx="200" cy="200" r="4" fill="white"/>
        <circle cx="850" cy="250" r="3" fill="white"/>
        <circle cx="180" cy="800" r="5" fill="white"/>
        <circle cx="820" cy="780" r="4" fill="white"/>
        <path d="M 750 150 L 755 160 L 765 155 L 760 165 L 770 170 L 760 175 L 765 185 L 755 180 L 750 190 L 745 180 L 735 185 L 740 175 L 730 170 L 740 165 L 735 155 L 745 160 Z"
              fill="white" opacity="0.8"/>
    </g>

    <!-- Glass reflection highlight -->
    <rect x="80" y="80" width="400" height="300" rx="140"
          fill="url(#glassGradient)"
          opacity="0.3"
          transform="rotate(-15 280 230)"/>
</svg>
