name: Deploy to App Store

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit for App Review?'
        required: true
        type: boolean
        default: false

jobs:
  deploy-appstore:
    name: Build and Deploy to App Store
    runs-on: macos-13

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Deploying version: $VERSION"

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

    - name: Install Fastlane
      run: |
        brew install fastlane
        fastlane --version

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        bundler-cache: true

    - name: Import Code Signing Certificates
      env:
        CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain

        echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

        rm certificate.p12

    - name: Import Provisioning Profile
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

    - name: Update Version Number
      if: env.VERSION != ''
      run: |
        cd PhotoLocApp
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.VERSION }}" PhotoLocApp/Info.plist
        BUILD_NUMBER=$(($(date +%s)))
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" PhotoLocApp/Info.plist
        echo "Version: ${{ env.VERSION }}, Build: $BUILD_NUMBER"

    - name: Build Archive
      run: |
        cd PhotoLocApp
        xcodebuild clean archive \
          -scheme PhotoLocApp \
          -configuration Release \
          -archivePath $PWD/build/PhotoLocApp.xcarchive \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
          PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}" \
          CODE_SIGN_IDENTITY="Apple Distribution"

    - name: Export IPA
      run: |
        cd PhotoLocApp

        cat > ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store</string>
          <key>teamID</key>
          <string>${{ secrets.APPLE_TEAM_ID }}</string>
          <key>uploadSymbols</key>
          <true/>
          <key>uploadBitcode</key>
          <false/>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath $PWD/build/PhotoLocApp.xcarchive \
          -exportPath $PWD/build \
          -exportOptionsPlist ExportOptions.plist

    - name: Upload to App Store Connect
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      run: |
        cd PhotoLocApp

        mkdir -p ~/private_keys
        echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > ~/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8

        xcrun altool --upload-app \
          --type ios \
          --file build/PhotoLocApp.ipa \
          --apiKey $APP_STORE_CONNECT_API_KEY_ID \
          --apiIssuer $APP_STORE_CONNECT_API_ISSUER_ID

        rm -rf ~/private_keys

    - name: Submit for App Review (Optional)
      if: github.event.inputs.submit_for_review == 'true'
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      run: |
        echo "Submitting for App Review..."
        # This requires fastlane or App Store Connect API
        # fastlane deliver submit_for_review
        echo "Note: Automatic submission requires additional setup with fastlane"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          PhotoLocApp/build/PhotoLocApp.ipa
        body: |
          ## PhotoLoc ${{ env.VERSION }}

          This release has been automatically built and uploaded to App Store Connect.

          ### What's Changed
          - See commit history for detailed changes

          ### Installation
          - TestFlight: Available in 10-30 minutes
          - App Store: Pending review

        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: appstore-release
        path: |
          PhotoLocApp/build/PhotoLocApp.ipa
          PhotoLocApp/build/PhotoLocApp.xcarchive
        retention-days: 90

    - name: Cleanup Keychain
      if: always()
      run: |
        security delete-keychain build.keychain || true

    - name: Notify Success
      if: success()
      run: |
        echo "🎉 Successfully deployed to App Store!"
        echo "Build will be available in App Store Connect shortly."

    - name: Notify Failure
      if: failure()
      run: |
        echo "❌ App Store deployment failed!"
        exit 1
